<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幻灯片与音乐控制器</title>
<style>
:root{color-scheme:light;--ink:#253044;--muted:#667085;--accent:#536dfe;--line:#e6e9f0;--paper:#fff}
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f5f7fb;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1080px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #26324a12}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:750}.small{color:var(--muted);font-size:13px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 13px;font:600 14px system-ui;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.45;cursor:not-allowed}
#slideNo{min-width:54px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.stage{position:relative;aspect-ratio:16/9;background:#eef1f7}iframe{width:100%;height:100%;border:0;display:block}
.audioBar{padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}audio{display:none}.track{font-weight:650}.hint{font-size:12px;color:var(--muted);margin-left:auto}
.notice{padding:0 18px 14px;color:var(--muted);font-size:12px}
@media(max-width:600px){body{padding:8px}.stage{aspect-ratio:4/3}header{padding:12px}.audioBar{padding:12px}.hint{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="brand">幻灯片播放器</div><div class="small">上一页 / 下一页 · 音乐播放控制</div></div>
    <div class="controls" aria-label="幻灯片导航">
      <button id="prev" type="button">Previous</button>
      <span id="slideNo" aria-live="polite">1</span>
      <button id="next" class="primary" type="button">Next</button>
    </div>
  </header>
  <div class="stage"><iframe id="slides" title="Google Slides 演示文稿" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
  <div class="audioBar">
    <span class="track">背景音乐</span>
    <button id="play" class="primary" type="button">▶ 播放/继续</button>
    <button id="pause" type="button">⏸ 暂停</button>
    <span id="audioState" class="small" aria-live="polite">正在尝试自动播放…</span>
    <audio id="music" preload="auto" loop playsinline></audio>
    <span class="hint">若浏览器拦截自动播放，请点击「播放」</span>
  </div>
  <div class="notice">Google Slides 的画面在独立播放器中显示；本页的播放/暂停按钮控制下方音乐。网页无法遥控 Slides 内嵌的原生音轨。</div>
</div>
<script>
(() => {
  // 请将此值改为演示文稿的 ID（来自 /presentation/d/…/edit 链接）。
  const presentationId = '1nNMgZoKokZwLLsQ9E9_kLZMP0kQ0SXzS9ghPYbP3qgQ';
  // 第一页 ID 已从用户提供的链接确认是 p1。后续页按 p2、p3…切换。
  const embed = document.getElementById('slides');
  const music = document.getElementById('music');
  const state = document.getElementById('audioState');
  let page = 1;
  function showPage() {
    const url = new URL(`https://docs.google.com/presentation/d/${presentationId}/embed`);
    url.searchParams.set('start', 'false');
    url.searchParams.set('loop', 'false');
    url.searchParams.set('delayms', '3000');
    url.searchParams.set('slide', `id.p${page}`);
    embed.src = url.toString();
    document.getElementById('slideNo').textContent = String(page);
    document.getElementById('prev').disabled = page <= 1;
  }
  document.getElementById('prev').addEventListener('click', () => { if(page > 1){ page--; showPage(); } });
  document.getElementById('next').addEventListener('click', () => { page++; showPage(); });
  const audioFile = new URL('./atlasaudio-happy-ukulele-617574.mp3', location.href).toString();
  music.src = audioFile;
  async function playMusic() {
    try { await music.play(); state.textContent = '音乐正在播放'; }
    catch { state.textContent = '自动播放被浏览器拦截，请点击「播放」'; }
  }
  document.getElementById('play').addEventListener('click', playMusic);
  document.getElementById('pause').addEventListener('click', () => { music.pause(); state.textContent = '音乐已暂停'; });
  music.addEventListener('ended', () => { state.textContent = '音乐已结束'; });
  showPage();
  playMusic();
})();
</script>
</body>
</html>
